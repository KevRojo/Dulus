# setuptools is pinned <77 on purpose: 77+ implements PEP 639 (SPDX license
# string + license-files) which emits Metadata-Version 2.4. pip < 24.1 — which
# ships on Ubuntu 24.04 LTS (pip 24.0) and many other current distros — cannot
# read Metadata 2.4 and silently skips the package, so `pip install dulus` fails
# with "Could not find a version that satisfies the requirement dulus (from
# versions: none)" on a fresh machine. Staying <77 keeps Metadata at 2.1/2.2.
[build-system]
requires = ["setuptools>=61,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dulus"
version = "3.13.3"
description = "Provider-independent agent runtime for the terminal — cloud and local models, real tools, MCP, plugins, memory, sub-agents, and Dulus OS."
readme = "README.md"
requires-python = ">=3.10"
# Legacy table form (not the PEP 639 SPDX string) so setuptools emits the older
# `License:` metadata field and keeps Metadata-Version at 2.1/2.2 — see the
# build-system note above. LICENSE ships via MANIFEST.in.
license = {text = "GPL-3.0-only"}
authors = [{name = "KevRojo", email = "dev@dulus.ai"}]
maintainers = [{name = "KevRojo", email = "dev@dulus.ai"}]
keywords = [
    # Providers and runtimes people actually search for.
    "ai", "cli", "llm", "claude", "gemini", "nvidia", "openai",
    "kimi", "deepseek", "qwen", "ollama", "local-llm", "openai-compatible",
    # What this thing IS. Without these the package never surfaces for the
    # queries its own users type.
    "agent", "ai-agent", "coding-agent", "autonomous-agent", "agentic",
    "mcp", "terminal", "tui", "repl", "developer-tools", "sub-agents",
    "tts", "voice",
]
classifiers = [
    # 19K+ installs, a full test suite and a 3.11.x line in production. This
    # sat at "4 - Beta" long after that stopped being true, and the Beta badge
    # is the first thing anyone reads on the PyPI page.
    "Development Status :: 5 - Production/Stable",
    # Dulus is not console-only: it ships a desktop GUI (pywebview), a Qt
    # status bar, a Flask webchat and Dulus OS. Listing just Console hid every
    # one of those surfaces.
    "Environment :: Console",
    "Environment :: Web Environment",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    # "Agentic AI for everyone" — the README's own pitch — is not a
    # developers-only audience.
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    # Topics decide which PyPI category listings this appears in. AI + Terminals
    # alone missed the shell, code-generation, chat and speech angles that
    # describe just as much of what Dulus does.
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Terminals",
    "Topic :: Software Development :: Code Generators",
    "Topic :: System :: Shells",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Utilities",
]
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    'tomli>=2.0; python_version < "3.11"',  # stdlib tomllib is 3.11+; backport for 3.10
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "Flask>=3.1.3",
    "bubblewrap-cli>=1.0.0",
    "customtkinter>=5.2.0",
    "Pillow>=10.0.0",
    "typing-extensions>=4.10.0",
    "pyttsx3",
    # Composio Tool Router — bundled plugin needs this to talk to 1000+ apps
    # without going through MCP. Only ~1MB on the wheel; worth it as a default.
    "composio>=1.0.0rc2",
    # HTML parsing — used by web scraping flows, harvest commands,
    # and several plugins. Tiny dep; ship it by default.
    "beautifulsoup4>=4.12.0",
    # Console QR for $DULUS reload wallets (post /login dulus)
    "segno>=1.6.0",
    "sentry-sdk>=2.0.0",
    # OS trust store — fixes CERTIFICATE_VERIFY_FAILED behind corporate TLS
    # interceptors (Cloudflare Zero Trust/WARP, Zscaler, Netskope). Tiny dep.
    "truststore>=0.9",
    # OCR — local text extraction from images/screenshots. pytesseract is
    # lightweight; Tesseract binary must be installed separately (see README).
    # Pillow already listed above — no duplicate needed.
    "pytesseract>=0.3.10",
    # Dulus Bar — the floating "Dynamic Island" (live model/ctx + Allow/Deny).
    # A normal library dep: pip pulls it (and its PyQt6) at install time; the
    # dulus wheel stays tiny — nothing is bundled. On by default so Dulus opens
    # with the island out of the box; a silent no-op on headless/no-display
    # boxes (Docker, servers, CI) since it never imports Qt without a screen.
    # Off switch for anyone who dislikes it: DULUS_BAR=0 or /config dulus_bar=0.
    "dulus-bar>=0.3.7",
    # Model Context Protocol (MCP) SDK & runtime utilities
    "mcp>=1.0.0",
    "uv>=0.4.0",
    "sse-starlette>=2.0.0",
    "starlette>=0.38.0",
]

# mempalace pulls chromadb (26 transitive deps incl. numpy + onnxruntime),
# which on termux/aarch64 has no wheels and on regular installs sends pip's
# resolver into a backtracking loop trying to reconcile typing-extensions /
# pydantic / httpx ranges. Keeping it optional lets `pip install dulus` succeed
# in seconds everywhere; power users opt in with `pip install dulus[memory]`
# (or `dulus[full]`) when they want MemPalace per-turn injection.
[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pyright>=1.1.400",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "twine>=5.0",
]
memory = ["mempalace>=3.3.4"]
voice = ["sounddevice", "pyttsx3", "elevenlabs>=1.0.0"]
webbridge = ["playwright>=1.40.0"]
# LiteLLM unified gateway — one provider entry, 100+ backends (OpenRouter,
# Groq, Together, Bedrock, Vertex, Cohere, Perplexity, xAI, Mistral, …).
# Optional because it pulls a sizeable transitive dep tree (tokenizers,
# tiktoken, click, importlib-metadata, etc.) most users won't need until
# they pick litellm in the welcome wizard.
litellm = ["litellm>=1.50.0"]
# OCR — local text extraction from images, no vision model call. Cheaper
# than /img for receipts, code screenshots, error stacks, dense tables.
# pytesseract needs the Tesseract binary installed separately:
#   Windows: winget install -e --id UB-Mannheim.TesseractOCR
#   Linux:   sudo apt-get install -y tesseract-ocr
#   macOS:   brew install tesseract
# easyocr is the pure-Python fallback but pulls ~1GB of PyTorch deps,
# so we leave it out of the default extra; opt in with `dulus[ocr-deep]`.
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0.0"]
ocr-deep = ["pytesseract>=0.3.10", "Pillow>=10.0.0", "easyocr>=1.7.0"]
full = ["mempalace>=3.3.4", "sounddevice", "elevenlabs>=1.0.0", "playwright>=1.40.0", "litellm>=1.50.0", "pytesseract>=0.3.10"]

[project.scripts]
dulus = "dulus:main"

[project.urls]
Homepage = "https://github.com/KevRojo/Dulus"
Repository = "https://github.com/KevRojo/Dulus"
Documentation = "https://kevrojo.github.io/Dulus/"
Changelog = "https://github.com/KevRojo/Dulus/blob/main/docs/news.md"
Issues = "https://github.com/KevRojo/Dulus/issues"

# ── Build config ────────────────────────────────────────────────────────────
# Fast-path: ship every top-level .py as a module + every subpackage with
# its __init__.py. Cleaner restructure can come later.
[tool.setuptools]
py-modules = [
    "agent",
    "algolia_search",
    "batch_api",
    "clipboard_utils",
    "cloudsave",
    "analytics",
    "common",
    "compaction",
    "config",
    "context",
    "display_blocks",
    "dulus",
    "dulus_account",
    "dulus_bar_client",
    "dulus_gui",
    "dulus_quick_menu",
    "file_filter",
    "fs_compass",
    "governance",
    "input",
    "license_manager",
    "lookback",
    "model_params",
    "paste_placeholders",
    "personality_config",
    "profiles",
    "providers",
    "pyconsole",
    "sandbox_bootstrap",
    "skills",
    "soul",
    "spinner",
    "steer_input",
    "subagent",
    "tmux_tools",
    "tool_registry",
    "tools",
    "tools_background",
    "tools_think",
    "tools_todo",
    "updater",
    "webchat",
    "webchat_server",
    "welcome",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "backend*",
    "banners*",
    "checkpoint*",
    "cli_animations*",
    "data*",
    "docs*",
    "gui*",
    "dulus_mcp*",
    "dulus_tools*",
    "memory*",
    "multi_agent*",
    "plugin*",
    "skill*",
    "task*",
    "ui*",
    "voice*",
    "webbridge*",
    "webchat_ui*",
    # sandbox/dist/ ships in the wheel so webchat serves /sandbox/ directly
    # (back to the 0.2.81 layout — no tarball, no extract-on-first-run).
    # GitHub Linguist won't double-count: .gitattributes marks sandbox/**
    # as linguist-vendored=true.
    "sandbox*",
]
exclude = [
    "tests*",
    "__pycache__*",
    # Don't ship sandbox sources / node_modules / vite cache — only dist/.
    "sandbox.src*",
    "sandbox.node_modules*",
    "sandbox.public*",
]

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.jsx", "*.ts", "*.tsx", "*.svg", "*.json", "*.md", "*.png", "*.jpg", "*.jpeg", "*.txt", "*.py"]
"sandbox" = ["dist/**/*", "dist/**/.*"]
# Bundled Agent Skills shipped with Dulus (kepano's obsidian-skills suite,
# etc.). Each lives at `skill/bundled/<name>/SKILL.md` with optional
# `references/*.md` files the skill body links to.
"skill" = ["bundled/**/*"]
